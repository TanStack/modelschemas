name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # The release job dispatches this on the Version Packages PR: PRs opened
  # with GITHUB_TOKEN start no pull_request runs, and `ci` is a required check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the changeset check can diff against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # A PR that changes a published package (packages/*, including the
      # generated client) needs a changeset, or `pnpm exec changeset --empty`.
      # Renovate can't write changesets; the Version Packages PR consumes them.
      - name: Changeset check
        if: github.event_name == 'pull_request' && github.actor != 'renovate[bot]' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/main

      # The committed client must match the spec (PLAN.md task 7.4).
      - name: Client drift check
        run: pnpm run check:client

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
