pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,ts,tsx,json,jsonc,md,css}'
      run: pnpm exec oxfmt --check {staged_files}
    - name: lint
      glob: '*.{js,ts,tsx}'
      run: pnpm exec oxlint --type-aware {staged_files}
    - name: typecheck
      run: pnpm run typecheck
